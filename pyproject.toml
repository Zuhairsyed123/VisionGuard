[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visionguard"
version = "0.1.0"
description = "VisionGuard: Modular Computer Vision Pipeline and Unsupervised Image Anomaly Detection"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "VisionGuard Contributors" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "opencv-python>=4.7.0",
    "streamlit>=1.25.0",
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
